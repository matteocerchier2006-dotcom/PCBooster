# Quando pubblichi una nuova versione (tag v1.2.3), GitHub crea PCBooster.exe su Windows e lo pubblica.
# La creazione dell'exe la fa build.py: per cambiarla basta caricare un build.py nuovo.
name: Crea e pubblica PC Booster

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa i componenti
        run: python -m pip install -r requirements.txt

      - name: Crea l'exe
        run: python build.py "${{ github.ref_name }}" "${{ github.repository }}"

      - name: Pubblica la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = git log -1 --format=%B
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/PCBooster.exe --clobber
          } else {
            gh release create $tag dist/PCBooster.exe --title "PC Booster $($tag.TrimStart('v'))" --notes "$notes"
          }
